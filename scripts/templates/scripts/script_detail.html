{% extends 'scripts/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-10 offset-md-1">
        
        <a href="{% url 'index' %}" class="btn btn-outline-secondary btn-sm mb-3">← العودة للرئيسية</a>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <span class="badge bg-primary mb-2">{{ script.category.name }}</span>
                <h2 class="fw-bold mb-3">{{ script.title }}</h2>
                <p class="text-secondary">{{ script.description }}</p>

                <!-- استدعاء القالب الديناميكي المعرّف من الـ view -->
                {% if runner_template %}
                    {% include runner_template %}
                {% endif %}

                <!-- عرض الكود الأصلي للسكريبت -->
                <h5 class="fw-bold mt-4">الكود المصدري للسكريبت:</h5>
                <div class="position-relative mt-2">
                    <button id="copy-btn" class="btn btn-light btn-sm position-absolute top-0 end-0 m-2" onclick="copyCode()">📋 نسخ</button>
                    <pre class="m-0 rounded"><code id="script-code" class="language-python">{{ script.code }}</code></pre>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
function copyCode() {
    const codeText = document.getElementById('script-code').innerText;
    navigator.clipboard.writeText(codeText).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerText = '✅ تم النسخ!';
        setTimeout(() => { btn.innerText = '📋 نسخ'; }, 2000);
    });
}
</script>
{% endblock %}
